<div id="wotd-widget-container">
  <div id="wotd-loading">Loading Word of the Day...</div>
  
  <div id="wotd-content-wrapper" style="display: none;">
    
    <!-- Top Section: Gray Background -->
    <div class="wotd-top">
      <div class="wotd-header">
        <span class="wotd-label">Word of the Day:</span>
        <span id="wotd-date" class="wotd-date"></span>
      </div>
      
      <div class="wotd-word-row">
        <h1 id="wotd-word"></h1>
        <!-- Speaker icon has been removed per instructions -->
      </div>
      
      <div class="wotd-divider"></div>
      
      <div class="wotd-meta">
        <span id="wotd-pos"></span>
        <span id="wotd-pos-divider" style="display:none;">|</span>
        <span id="wotd-pron"></span>
      </div>
    </div>

    <!-- Bottom Section: White Background -->
    <div class="wotd-bottom">
      <h2 class="wotd-subtitle">What it Means</h2>
      <div id="wotd-raw-content"></div>
    </div>
    
  </div>
</div>

<style>
  #wotd-widget-container { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 600px; margin: 0 auto; background: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: #333333; overflow: hidden; }
  .wotd-top { background-color: #d1d8dc; padding: 30px 40px; }
  .wotd-header { font-size: 1rem; margin-bottom: 25px; }
  .wotd-label { color: #0b4a60; font-weight: 700; }
  .wotd-date { color: #437a8c; margin-left: 5px; }
  .wotd-word-row { margin-bottom: 15px; }
  #wotd-word { font-family: Georgia, "Times New Roman", serif; font-size: 4rem; color: #111111; margin: 0; font-weight: normal; letter-spacing: 1px; }
  .wotd-divider { height: 2px; background-color: #d32f2f; width: 100%; max-width: 250px; margin-bottom: 15px; }
  .wotd-meta { color: #8fa0a8; font-size: 1.1rem; font-weight: 400; }
  #wotd-pos-divider { margin: 0 12px; color: #a4b4bc; }
  #wotd-pron { font-style: italic; }
  .wotd-bottom { background-color: #ffffff; padding: 30px 40px; }
  .wotd-subtitle { font-family: Georgia, "Times New Roman", serif; color: #0b4a60; font-size: 1.8rem; margin-top: 0; margin-bottom: 20px; font-weight: 700; }
  #wotd-raw-content { font-size: 1.1rem; line-height: 1.6; color: #1a1a1a; }
  #wotd-raw-content p { margin-bottom: 20px; }
  #wotd-loading { padding: 40px; text-align: center; font-family: sans-serif; color: #666; }
</style>

<script>
  const rssUrl = 'https://www.merriam-webster.com/wotd/feed/rss2';
  const encodedUrl = encodeURIComponent(rssUrl);
  const cacheBuster = new Date().getTime();
  
  // A rotation of reliable CORS proxies with cache-busting timestamps
  // to prevent retrieving cached 500 Internal Server Errors.
  const proxies = [
    { url: `https://api.allorigins.win/get?url=${encodedUrl}&cb=${cacheBuster}`, type: 'json' },
    { url: `https://api.codetabs.com/v1/proxy?quest=${encodedUrl}&cb=${cacheBuster}`, type: 'raw' },
    { url: `https://corsproxy.io/?${encodedUrl}`, type: 'raw' },
    { url: `https://thingproxy.freeboard.io/fetch/${rssUrl}`, type: 'raw' }
  ];

  async function fetchWotdFeed() {
    for (let proxy of proxies) {
      try {
        const response = await fetch(proxy.url);
        if (!response.ok) continue; 

        let xmlText = '';
        if (proxy.type === 'json') {
          const data = await response.json();
          if (!data.contents) continue;
          xmlText = data.contents;
        } else {
          xmlText = await response.text();
        }
        
        return xmlText; 
      } catch (error) {
        console.warn('Proxy failed, attempting fallback:', proxy.url);
      }
    }
    throw new Error('All CORS proxies are currently unreachable.');
  }

  fetchWotdFeed()
    .then(xmlText => {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const items = xmlDoc.querySelectorAll("item");
      
      if (items.length > 0) {
        const latestWord = items[0];
        
        const rawTitle = latestWord.querySelector("title").textContent;
        const rawPubDate = latestWord.querySelector("pubDate").textContent;
        
        const contentEncoded = latestWord.getElementsByTagNameNS("*", "encoded")[0];
        const rawDescription = contentEncoded ? contentEncoded.textContent : latestWord.querySelector("description").textContent;

        const pubDate = new Date(rawPubDate);
        const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('wotd-date').innerText = pubDate.toLocaleDateString('en-US', dateOptions);

        const cleanTitle = rawTitle.replace('Word of the Day: ', '').trim();
        document.getElementById('wotd-word').innerText = cleanTitle;
        
        const tempDiv = document.createElement('div');
tempDiv.innerHTML = rawDescription;

// Work with all <p> tags no matter how deeply they're wrapped (the feed nests them in <font>)
const paras = Array.from(tempDiv.querySelectorAll('p'));

// The "word line" is the paragraph containing the \pronunciation\
const wordLine = paras.find(p => /\\[^\\]+\\/.test(p.textContent));

if (wordLine) {
  const pronMatch = wordLine.textContent.match(/\\([^\\]+)\\/);
  if (pronMatch) document.getElementById('wotd-pron').innerText = pronMatch[1];

  const em = wordLine.querySelector('em');
  if (em) document.getElementById('wotd-pos').innerText = em.textContent.trim();
}

if (document.getElementById('wotd-pos').innerText && document.getElementById('wotd-pron').innerText) {
  document.getElementById('wotd-pos-divider').style.display = 'inline';
}

const finalContentDiv = document.getElementById('wotd-raw-content');
finalContentDiv.innerHTML = '';

for (const p of paras) {
  if (p === wordLine) continue;
  const text = p.textContent.trim();

  if (!text) continue;
  if (text.includes('Word of the Day for')) continue;   // header line
  if (text.startsWith('Examples:') || text.startsWith('Did you know?')) break;
  if (text.startsWith('See the entry')) continue;

  const clone = p.cloneNode(true);
  if (text.startsWith('//')) {                           // example sentences
    clone.innerHTML = clone.innerHTML.replace(/^\s*\/\/\s*/, '');
    clone.style.fontStyle = 'italic';
    clone.style.color = '#555';
  }
  finalContentDiv.appendChild(clone);
}

        document.getElementById('wotd-loading').style.display = 'none';
        document.getElementById('wotd-content-wrapper').style.display = 'block';
        
      } else {
        document.getElementById('wotd-loading').innerText = 'Could not load Word of the Day data.';
      }
    })
    .catch(error => {
      console.error('Fetch error:', error);
      document.getElementById('wotd-loading').innerText = 'Error loading Word of the Day. Proxies are temporarily down.';
    });
</script>
