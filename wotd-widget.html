<div id="wotd-widget-container">
  <div id="wotd-loading">Loading Word of the Day...</div>
  
  <div id="wotd-content-wrapper" style="display: none;">
    
    <!-- Top Section: Gray Background -->
    <div class="wotd-top">
      <div class="wotd-header">
        <span class="wotd-label">Word of the Day:</span>
        <span id="wotd-date" class="wotd-date"></span>
      </div>
      
      <div class="wotd-word-row">
        <h1 id="wotd-word"></h1>
        <!-- Speaker icon has been removed per instructions -->
      </div>
      
      <div class="wotd-divider"></div>
      
      <div class="wotd-meta">
        <span id="wotd-pos"></span>
        <span id="wotd-pos-divider" style="display:none;">|</span>
        <span id="wotd-pron"></span>
      </div>
    </div>

    <!-- Bottom Section: White Background -->
    <div class="wotd-bottom">
      <h2 class="wotd-subtitle">What it Means</h2>
      <div id="wotd-raw-content"></div>
    </div>
    
  </div>
</div>

<style>
  /* Base Widget Container */
  #wotd-widget-container {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 600px;
    margin: 0 auto;
    background: #ffffff;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    color: #333333;
    overflow: hidden;
  }

  /* Top Gray Section */
  .wotd-top {
    background-color: #d1d8dc;
    padding: 30px 40px;
  }

  .wotd-header {
    font-size: 1rem;
    margin-bottom: 25px;
  }

  .wotd-label {
    color: #0b4a60;
    font-weight: 700;
  }

  .wotd-date {
    color: #437a8c;
    margin-left: 5px;
  }

  .wotd-word-row {
    margin-bottom: 15px;
  }

  #wotd-word {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 4rem;
    color: #111111;
    margin: 0;
    font-weight: normal;
    letter-spacing: 1px;
  }

  /* Red Underline */
  .wotd-divider {
    height: 2px;
    background-color: #d32f2f;
    width: 100%;
    max-width: 250px;
    margin-bottom: 15px;
  }

  /* Part of Speech & Pronunciation */
  .wotd-meta {
    color: #8fa0a8;
    font-size: 1.1rem;
    font-weight: 400;
  }
  
  #wotd-pos-divider {
    margin: 0 12px;
    color: #a4b4bc;
  }
  
  #wotd-pron {
    font-style: italic;
  }

  /* Bottom White Section */
  .wotd-bottom {
    background-color: #ffffff;
    padding: 30px 40px;
  }

  .wotd-subtitle {
    font-family: Georgia, "Times New Roman", serif;
    color: #0b4a60;
    font-size: 1.8rem;
    margin-top: 0;
    margin-bottom: 20px;
    font-weight: 700;
  }

  /* Styling the injected RSS HTML */
  #wotd-raw-content {
    font-size: 1.1rem;
    line-height: 1.6;
    color: #1a1a1a;
  }

  #wotd-raw-content p {
    margin-bottom: 20px;
  }

  /* Indent the Example sentences (which start with //) */
  #wotd-raw-content p:empty {
    display: none;
  }

  #wotd-loading {
    padding: 40px;
    text-align: center;
    font-family: sans-serif;
    color: #666;
  }
</style>

<script>
  const rssUrl = 'https://www.merriam-webster.com/wotd/feed/rss2';
  const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(rssUrl);

  fetch(proxyUrl)
    .then(response => {
      if (!response.ok) throw new Error('Network response was not ok');
      return response.text(); 
    })
    .then(str => new window.DOMParser().parseFromString(str, "text/xml")) 
    .then(data => {
      const items = data.querySelectorAll("item");
      if (items.length > 0) {
        const latestWord = items[0];
        
        const rawTitle = latestWord.querySelector("title").textContent;
        const rawPubDate = latestWord.querySelector("pubDate").textContent;
        
        // Grab the HTML payload from either content:encoded or description
        const contentEncoded = latestWord.getElementsByTagNameNS("*", "encoded")[0];
        const rawDescription = contentEncoded ? contentEncoded.textContent : latestWord.querySelector("description").textContent;

        // 1. Format the Date
        const pubDate = new Date(rawPubDate);
        const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('wotd-date').innerText = pubDate.toLocaleDateString('en-US', dateOptions);

        // 2. Set the Main Word
        const cleanTitle = rawTitle.replace('Word of the Day: ', '').trim();
        document.getElementById('wotd-word').innerText = cleanTitle;
        
        // Load the raw HTML into a temporary container to safely parse it
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = rawDescription;

        // 3. Robust Extraction & Cleanup
        const pTags = tempDiv.querySelectorAll('p');
        
        pTags.forEach(p => {
            const text = p.textContent;
            
            // A. Remove the repetitive intro sentence
            if (text.includes("Word of the Day for")) {
                p.remove();
                return;
            }

            // B. Extract Pronunciation
            // We look for text between backslashes (e.g. \STIG-muh\)
            if (text.includes('\\')) {
                const pronMatch = text.match(/\\([^\\]+)\\/);
                if (pronMatch && pronMatch[1]) {
                    document.getElementById('wotd-pron').innerText = pronMatch[1];
                    
                    // Carefully erase just the pronunciation part from this paragraph
                    // so we don't accidentally delete the definition if they are attached!
                    p.innerHTML = p.innerHTML.replace(/\\([^\\]+)\\/g, '').trim();
                }
            }

            // C. Extract Part of Speech 
            // MW usually puts it in an <em> tag near the top
            const emTags = p.querySelectorAll('em');
            emTags.forEach(em => {
                const emText = em.textContent.toLowerCase().trim();
                // Check if it's a known part of speech to avoid grabbing an italicized example sentence
                if (['noun', 'verb', 'adjective', 'adverb', 'pronoun', 'preposition', 'conjunction'].includes(emText)) {
                    document.getElementById('wotd-pos').innerText = emText;
                    em.remove(); // Remove the POS from the body text
                }
            });

            // D. Remove redundant word headers if MW included them (e.g. <strong>stigma</strong>)
            const strongTags = p.querySelectorAll('strong');
            strongTags.forEach(strong => {
                if (strong.textContent.toLowerCase().trim() === cleanTitle.toLowerCase()) {
                    strong.remove();
                }
            });
            
            // E. Clean up weird bullet points or stray colons left behind
            if (p.innerHTML.startsWith('•') || p.innerHTML.startsWith(':')) {
                 p.innerHTML = p.innerHTML.substring(1).trim();
            }

            // F. Remove empty paragraphs caused by our cleanup
            if (p.textContent.trim() === '') {
                p.remove();
            }
        });

        // Show the separator pipe "|" if both items exist
        if (document.getElementById('wotd-pos').innerText && document.getElementById('wotd-pron').innerText) {
            document.getElementById('wotd-pos-divider').style.display = 'inline';
        }

        // 4. Remove the "Did you know?" section and everything below it
        let hitDidYouKnow = false;
        Array.from(tempDiv.children).forEach(child => {
            if (hitDidYouKnow) { 
                child.remove(); 
                return; 
            }
            if (child.textContent.includes("Did you know?")) { 
                hitDidYouKnow = true; 
                child.remove(); 
            }
        });

        // 5. Remove lingering subscription/entry links
        tempDiv.querySelectorAll('a').forEach(a => {
            const linkText = a.textContent.toLowerCase();
            if (linkText.includes("see the entry") || linkText.includes("subscribe to")) {
                let parent = a.parentElement;
                a.remove();
                if (parent && parent.textContent.trim() === '') parent.remove(); 
            }
        });

        // Finally, inject the fully cleaned HTML into the widget
        document.getElementById('wotd-raw-content').innerHTML = tempDiv.innerHTML;
        document.getElementById('wotd-loading').style.display = 'none';
        document.getElementById('wotd-content-wrapper').style.display = 'block';
      } else {
        document.getElementById('wotd-loading').innerText = 'Could not load Word of the Day.';
      }
    })
    .catch(error => {
      console.error('Error fetching WOTD:', error);
      document.getElementById('wotd-loading').innerText = 'Error loading Word of the Day. Please check CORS proxy.';
    });
</script>
